<!-- Map Container -->
<main class="relative w-full h-screen">
    <div id="map"></div>

    <!-- Search Overlay on Top of Map -->
    <div class="search-overlay">
        <form id="map-search-form" class="glass-panel rounded-xl p-2 flex items-center group transition-all duration-300 shadow-lg focus-within:ring-2 focus-within:ring-primary/50 bg-white/90">
            <div class="pl-4 pr-3 flex items-center pointer-events-none">
                <span class="material-symbols-outlined text-outline" data-icon="search">search</span>
            </div>
            <input id="map-search-input" class="w-full bg-transparent border-none focus:ring-0 text-body-md placeholder:text-outline/70 py-3 font-body-md focus:outline-none" placeholder="Search Global Index for places or buildings..." type="text" required/>
            <button type="submit" id="search-btn" class="bg-primary hover:bg-primary-container text-on-primary font-label-caps py-3 px-6 rounded-lg transition-all active:scale-95 flex items-center gap-2 shadow-sm">
                <span>LOCATE</span>
                <span class="material-symbols-outlined text-sm" id="search-icon" data-icon="my_location">my_location</span>
            </button>
        </form>
        
        <!-- Error or Status Message -->
        <div id="status-message" class="hidden mt-2 text-center p-2 rounded-md font-body-md text-sm shadow-md bg-white border border-outline-variant/50"></div>
    </div>
    
    <!-- Info Panel overlay -->
    <div id="info-panel" class="hidden absolute bottom-8 left-8 z-[1000] glass-panel p-6 rounded-lg shadow-xl max-w-sm bg-white/90 border border-primary/20">

                <span class="font-label-caps text-[10px] text-outline uppercase">LAT</span>
                <span id="info-lat" class="font-data-mono text-xs">--</span>
            </div>
            <div class="flex flex-col">
                <span class="font-label-caps text-[10px] text-outline uppercase">LNG</span>
                <span id="info-lng" class="font-data-mono text-xs">--</span>
            </div>
        </div>
        <button id="analyze-btn" class="w-full bg-primary-container/20 text-primary border border-primary hover:bg-primary hover:text-on-primary font-label-caps py-2 px-4 rounded transition-all flex items-center justify-center gap-2 mb-2">
            <span>ANALYZE STRUCTURE</span>
            <span class="material-symbols-outlined text-sm">analytics</span>
        </button>
        <div class="mb-2">
            <label class="font-label-caps text-[10px] text-outline uppercase block mb-1">DISASTER SCENARIO</label>
            <select id="disaster-select" class="w-full border border-outline-variant bg-white text-on-surface text-sm rounded px-2 py-1.5 focus:outline-none focus:border-primary">
                <option value="">None — baseline stress only</option>
                <option value="seismic">🌍 Earthquake</option>
                <option value="storm">🌪️ 100-Year Storm</option>
                <option value="wind">💨 High Wind Event</option>
                <option value="flood">🌊 Flood / Storm Surge</option>
                <option value="fire">🔥 Structural Fire</option>
                <option value="tornado">🌀 Tornado</option>
                <option value="lightning">⚡ Lightning Strike</option>
                <option value="blizzard">❄️ Blizzard / Ice Storm</option>
                <option value="landslide">🏔️ Landslide</option>
                <option value="volcanic">🌋 Volcanic Eruption</option>
            </select>
        </div>
        <button id="simulate-btn" class="w-full bg-primary text-on-primary hover:brightness-110 font-label-caps py-2 px-4 rounded transition-all flex items-center justify-center gap-2">
            <span>SIMULATE STRESS</span>
            <span class="material-symbols-outlined text-sm">science</span>
        </button>

<script>
    // Initialize Leaflet Map
    // Start at a general world view or some default
    const map = L.map('map', {
        zoomControl: false // Will add custom position if needed, or leave default top-left (hidden under nav sometimes)
    }).setView([20, 0], 2);

    L.control.zoom({
        position: 'bottomright'
    }).addTo(map);

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    let currentMarker = null;

    // Custom marker icon based on brand
    const customIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div style="background-color: #725a3d; width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
    });

    function placeMarker(lat, lon) {
        if (currentMarker) map.removeLayer(currentMarker);
        currentMarker = L.marker([lat, lon], {icon: customIcon}).addTo(map);
    }

    // Show info panel and wire Analyze / Simulate buttons for the selected structure
    function showInfoPanel(name, description, lat, lon) {
        if (window.ArchPiBuilding) ArchPiBuilding.set(name);
        const infoPanel = document.getElementById('info-panel');
        document.getElementById('info-title').textContent = name;
        document.getElementById('info-desc').textContent = description;
        document.getElementById('info-lat').textContent = lat.toFixed(4) + '°';
        document.getElementById('info-lng').textContent = lon.toFixed(4) + '°';

        infoPanel.classList.remove('hidden');
        infoPanel.classList.add('animate-in', 'fade-in', 'slide-in-from-bottom-4');

        document.getElementById('analyze-btn').onclick = () => {
            window.location.href = `analysis.html?q=${encodeURIComponent(name)}`;
        };
        document.getElementById('simulate-btn').onclick = () => {
            const disaster = document.getElementById('disaster-select').value;
            let url = `simulation.html?q=${encodeURIComponent(name)}`;
            if (disaster) url += `&disaster=${disaster}`;
            window.location.href = url;
        };
    }

    // Function to search and place marker
    async function searchLocation(query) {
        const statusMsg = document.getElementById('status-message');
        const searchIcon = document.getElementById('search-icon');
        const infoPanel = document.getElementById('info-panel');
        
        // UI updates for loading
        statusMsg.classList.add('hidden');
        searchIcon.textContent = 'autorenew';
        searchIcon.classList.add('loading-spinner');
        infoPanel.classList.add('hidden');

        try {
            // Nominatim API call
            const response = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
            const data = await response.json();

            if (data && data.length > 0) {
                const result = data[0];
                const lat = parseFloat(result.lat);
                const lon = parseFloat(result.lon);

                // View location
                map.flyTo([lat, lon], 14, {
                    animate: true,
                    duration: 1.5
                });

                placeMarker(lat, lon);

                // Parse display name to be more readable
                const displayParts = result.display_name.split(',');
                setTimeout(() => {
                    showInfoPanel(query, displayParts.slice(0, 3).join(', '), lat, lon);
                }, 1500); // Show panel after flyTo animation

            } else {
                statusMsg.textContent = 'Location not found. Please try a different query.';
                statusMsg.classList.remove('hidden');
                statusMsg.classList.add('text-error', 'bg-error-container');
            }
        } catch (error) {
            console.error('Error fetching location:', error);
            statusMsg.textContent = 'Network error occurred while searching.';
            statusMsg.classList.remove('hidden');
            statusMsg.classList.add('text-error', 'bg-error-container');
        } finally {
            // Restore icon
            searchIcon.textContent = 'my_location';
            searchIcon.classList.remove('loading-spinner');
        }
    }

    // Click anywhere on the map to identify and select the building / structure there
    map.on('click', async (e) => {
        const { lat, lng } = e.latlng;
        const statusMsg = document.getElementById('status-message');
        statusMsg.classList.add('hidden');

        placeMarker(lat, lng);

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=18&addressdetails=1`);
            const d = await response.json();

            if (d && !d.error) {
                // Prefer the specific structure name over street/city
                const name = d.name
                    || d.address?.building || d.address?.tourism || d.address?.historic
                    || d.address?.amenity || d.address?.man_made
                    || d.display_name.split(',')[0];
                const displayParts = (d.display_name || '').split(',');
                showInfoPanel(name, displayParts.slice(0, 3).join(', '), lat, lng);
                document.getElementById('map-search-input').value = name;
            } else {
                statusMsg.textContent = 'No structure identified at this location. Try zooming in and clicking directly on a building.';
                statusMsg.classList.remove('hidden');
                statusMsg.classList.add('text-error', 'bg-error-container');
            }
        } catch (err) {
            console.error('Reverse geocoding error:', err);
        }
    });

    // Handle form submission on the map page
    document.getElementById('map-search-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const query = document.getElementById('map-search-input').value;
        if(query.trim()) {
            searchLocation(query);
        }
    });

    // Check URL parameters on load
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        
        if (query) {
            document.getElementById('map-search-input').value = query;
            searchLocation(query);
        }
    });

</script>
